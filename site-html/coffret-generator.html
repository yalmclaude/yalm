<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yalm Events — Générateur de coffrets</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --blanc: #FBF8F3;
  --beige: #F5EAD9;
  --beige-dark: #D9C4A8;
  --bordeaux: #4C0303;
  --bordeaux-deep: #300202;
  --texte: #2B211D;
  --texte-soft: #6E625A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--blanc); font-family: 'Inter', sans-serif; color: var(--texte); }
button { font-family: inherit; cursor: pointer; }
input, select { font-family: inherit; }
input:focus, select:focus { outline: none; border-color: var(--bordeaux) !important; }
img { max-width: 100%; }
a { color: inherit; }

.btn { border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; }
.btn-primary { background: var(--bordeaux); color: var(--blanc); padding: 13px 26px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 2px; }
.btn-outline { background: none; border: 1px solid var(--bordeaux); color: var(--bordeaux); padding: 9px 16px; font-size: 12px; border-radius: 2px; }
.btn-ghost { background: none; border: 1px solid var(--beige-dark); color: var(--texte); padding: 9px 16px; font-size: 12px; border-radius: 2px; }
.btn-danger { background: none; border: 1px solid #D98787; color: #B84545; padding: 9px 14px; font-size: 12px; border-radius: 2px; }

.field-label { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--texte-soft); margin-bottom: 6px; }
.field-input { width: 100%; border: 1px solid var(--beige-dark); border-radius: 2px; padding: 10px 12px; font-size: 14px; color: var(--texte); background: var(--blanc); }

.fade-in-up { animation: fadeInUp 0.7s ease both; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.phone-ring { animation: ring 0.9s ease-in-out infinite; }
@keyframes ring { 0%,100% { transform: rotate(0deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(6deg); } }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.dash-card { position: relative; height: 420px; border: none; padding: 0; cursor: pointer; overflow: hidden; border-radius: 2px; text-align: left; display: block; }
.dash-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s ease; display: block; }
.dash-card:hover img { transform: scale(1.06); }

.video-card { background: none; border: none; padding: 0; cursor: pointer; text-align: left; display: block; width: 100%; }
.video-card { transition: transform 0.3s ease; }
.video-card:hover { transform: translateY(-4px); }
.video-card .thumb-wrap { position: relative; overflow: hidden; border-radius: 2px; box-shadow: 0 10px 26px rgba(76,3,3,0.18); transition: box-shadow 0.3s ease; }
.video-card:hover .thumb-wrap { box-shadow: 0 18px 40px rgba(76,3,3,0.32); }
.video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; transition: transform 0.6s ease; display: block; }
.video-card .play-circle { transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease; }
.video-card:hover .play-circle { transform: translate(-50%,-50%) scale(1.15); background: var(--blanc); color: var(--bordeaux); }
.video-card:hover img { transform: scale(1.05); }

.masonry { column-count: 3; column-gap: 14px; }
.masonry-item { position: relative; break-inside: avoid; margin-bottom: 14px; cursor: pointer; animation: fadeInUp 0.6s ease both; }
.masonry-item img { transition: transform 0.45s ease, box-shadow 0.45s ease; display: block; }
.masonry-item:hover img { transform: scale(1.035); box-shadow: 0 14px 30px rgba(76,3,3,0.28); }
.masonry-item .fav-btn { transition: transform 0.25s ease, background 0.25s ease; }
.masonry-item:hover .fav-btn { transform: scale(1.1); }

.chip { border-radius: 30px; padding: 8px 18px; font-size: 12px; border: 1px solid var(--beige-dark); background: transparent; color: var(--texte-soft); transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.2s ease; }
.chip:hover { border-color: var(--bordeaux); color: var(--bordeaux); }
.chip.active { background: var(--bordeaux); color: var(--blanc); border-color: var(--bordeaux); }

.polaroid { border: 6px solid var(--blanc); box-shadow: 0 8px 20px rgba(76,3,3,0.25); transition: transform 0.35s ease, box-shadow 0.35s ease; display: block; }
.polaroid:hover { transform: rotate(0deg) scale(1.07) !important; box-shadow: 0 16px 34px rgba(76,3,3,0.4); z-index: 5; position: relative; }

.nav-links { display: flex; gap: 36px; }
.nav-burger { display: none; background: none; border: none; color: var(--bordeaux); }
.nav-mobile-panel { display: none; flex-direction: column; padding: 0 24px 20px; gap: 4px; }
.nav-mobile-panel.open { display: flex; }

@media (max-width: 900px) {
  .masonry { column-count: 2; }
  .dash-grid { grid-template-columns: 1fr !important; }
  .video-grid { grid-template-columns: 1fr !important; }
  .quotes-grid { grid-template-columns: 1fr !important; }
  .form-grid-2 { grid-template-columns: 1fr !important; }
  .nav-links { display: none !important; }
  .nav-burger { display: block !important; }
}
</style>
</head>

  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#4C0303"/><circle cx="200" cy="130" r="34" fill="none" stroke="#F5EAD9" stroke-width="2"/><path d="M191 114l30 16-30 16z" fill="#F5EAD9"/></svg>`

const DEFAULT_CATEGORIES = ["Préparatifs", "Cérémonie", "Couple", "Cocktail", "Dîner", "Soirée", "Détails"];
const INDEX_KEY = "yalm-coffrets-index";
const coffretKey = (slug) => `yalm-coffret-${slug}`;

// Uses Claude's persistent artifact storage when this file runs inside a Claude
// conversation; otherwise falls back to the browser's own localStorage so the
// file also works as a standalone .html file opened directly or hosted anywhere.
const hasCloudStorage = typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";

function slugify(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "") || "coffret";
}
function uid() { return Math.random().toString(36).slice(2, 9); }
function listForKind(c, kind) {
  return kind === "photo" ? c.photos : kind === "video" ? c.videos : kind === "product" ? c.products : c.messages;
}
function esc(s) { return (s ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtTime(sec) { const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${s.toString().padStart(2,"0")}`; }
function getShareLink(c) { return `${location.origin}${location.pathname}#/mariage/${encodeURIComponent(c.slug)}`; }

function blankCoffret() {
  return {
    slug: "", names: "", date: "", location: "", code: "",
    cover: "https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=1600&auto=format&fit=crop",
    final: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?q=80&w=1600&auto=format&fit=crop",
    categories: [...DEFAULT_CATEGORIES],
    photos: [], videos: [], messages: [], products: [], updatedAt: Date.now(),
  };
}
function withDefaults(c) {
  if (!c) return c;
  if (!Array.isArray(c.categories) || c.categories.length === 0) c.categories = [...DEFAULT_CATEGORIES];
  if (!Array.isArray(c.products)) c.products = [];
  return c;
}

async function loadIndex() {
  try {
    if (hasCloudStorage) { const r = await window.storage.get(INDEX_KEY, false); return r ? JSON.parse(r.value) : []; }
    const v = localStorage.getItem(INDEX_KEY); return v ? JSON.parse(v) : [];
  } catch { return []; }
}
async function saveIndex(list) {
  if (hasCloudStorage) { await window.storage.set(INDEX_KEY, JSON.stringify(list), false); return; }
  localStorage.setItem(INDEX_KEY, JSON.stringify(list));
}
async function loadCoffret(slug) {
  try {
    if (hasCloudStorage) { const r = await window.storage.get(coffretKey(slug), false); return r ? withDefaults(JSON.parse(r.value)) : null; }
    const v = localStorage.getItem(coffretKey(slug)); return v ? withDefaults(JSON.parse(v)) : null;
  } catch { return null; }
}
const COFFRET_SIZE_LIMIT = 4.5 * 1024 * 1024; // stay under the ~5MB per-key storage cap, leaving headroom

async function saveCoffret(c) {
  const payload = JSON.stringify(c);
  if (payload.length > COFFRET_SIZE_LIMIT) {
    const err = new Error("TOO_LARGE");
    err.code = "TOO_LARGE";
    throw err;
  }
  if (hasCloudStorage) { await window.storage.set(coffretKey(c.slug), payload, false); return; }
  localStorage.setItem(coffretKey(c.slug), payload);
}
async function deleteCoffretStorage(slug) {
  try {
    if (hasCloudStorage) { await window.storage.delete(coffretKey(slug), false); return; }
    localStorage.removeItem(coffretKey(slug));
  } catch {}
}

/* ===================== global state ===================== */

const state = {
  screen: "dashboard",     // dashboard | edit | preview
  index: [],
  loading: true,
  storageError: false,
  activeCoffret: null,     // full coffret object being edited/previewed
  preview: {
    unlocked: false, view: "home", code: "", codeError: false, menuOpen: false,
    filter: "Tout", favorites: new Set(), lightboxIndex: null, videoModal: null, qrModal: false,
    audio: { answered: false, ringing: true, playingId: null, continuous: false },
  },
};

const app = document.getElementById("app");
const hiddenInput = document.getElementById("hidden-file-input");
let pendingTarget = null;

const STORABLE_MAX_BYTES = 1.2 * 1024 * 1024; // ~1.2MB raw (~1.6MB once base64-encoded): kept small so several files still fit the ~5MB total budget for one coffret

function fileToStorableUrl(file) {
  if (file.size > STORABLE_MAX_BYTES) return Promise.resolve({ url: URL.createObjectURL(file), durable: false });
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ url: reader.result, durable: true });
    reader.onerror = () => resolve({ url: URL.createObjectURL(file), durable: false });
    reader.readAsDataURL(file);
  });
}

hiddenInput.addEventListener("change", async () => {
  const files = Array.from(hiddenInput.files || []);
  if (files.length === 0 || !pendingTarget) { hiddenInput.value = ""; pendingTarget = null; return; }
  syncEditFieldsIntoState();
  const c = state.activeCoffret;
  const needsThumb = []; // video rows added/edited here with no thumbnail yet
  let sessionOnlyCount = 0;
  const target = pendingTarget;
  hiddenInput.value = "";
  pendingTarget = null;

  if (target.kind === "photo-bulk") {
    for (const file of files) {
      const { url, durable } = await fileToStorableUrl(file);
      if (!durable) sessionOnlyCount++;
      c.photos.push({ id: uid(), category: c.categories[0] || "Photos", src: url });
    }
  } else if (target.kind === "mixed-bulk") {
    const stripExt = (name) => name.replace(/\.[^.]+$/, "");
    for (const file of Array.from(files)) {
      const type = file.type || "";
      const { url, durable } = await fileToStorableUrl(file);
      if (!durable) sessionOnlyCount++;
      if (type.startsWith("image/")) {
        c.photos.push({ id: uid(), category: c.categories[0] || "Photos", src: url });
      } else if (type.startsWith("video/")) {
        const row = { id: uid(), title: stripExt(file.name), duration: "", thumb: "", src: url };
        c.videos.push(row);
        needsThumb.push(row);
      } else if (type.startsWith("audio/")) {
        c.messages.push({ id: uid(), name: stripExt(file.name), duration: 30, quote: "", src: url });
      }
    }
  } else if (target.kind === "cover" || target.kind === "final") {
    const { url } = await fileToStorableUrl(files[0]);
    c[target.kind] = url;
  } else {
    const list = listForKind(c, target.kind);
    const row = list.find(r => r.id === target.id);
    if (row) {
      const { url, durable } = await fileToStorableUrl(files[0]);
      if (!durable) sessionOnlyCount++;
      row[target.field] = url;
      if (target.kind === "video" && target.field === "src" && !row.thumb) needsThumb.push(row);
    }
  }
  render();

  if (sessionOnlyCount > 0) {
    alert(`${sessionOnlyCount} fichier(s) dépassent 4 Mo et restent temporaires : ils fonctionnent tant que cette page reste ouverte, mais disparaîtront après un rechargement. Pour un coffret définitif, hébergez ces fichiers (Drive, Cloudflare R2...) et collez leur lien à la place.`);
  }

  // Auto-generate a cover image from the video's own first frame when none was set manually.
  needsThumb.forEach(row => {
    generateVideoThumbnail(row.src).then(dataUrl => {
      if (dataUrl && !row.thumb) { row.thumb = dataUrl; if (state.screen === "edit") render(); }
    });
  });
});

function generateVideoThumbnail(videoUrl) {
  return new Promise((resolve) => {
    const vid = document.createElement("video");
    vid.src = videoUrl;
    vid.muted = true;
    vid.playsInline = true;
    vid.preload = "metadata";
    const cleanup = () => { vid.remove(); };
    vid.addEventListener("loadeddata", () => {
      try { vid.currentTime = Math.min(0.5, (vid.duration || 1) / 10); }
      catch { resolve(null); cleanup(); }
    });
    vid.addEventListener("seeked", () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = vid.videoWidth || 400;
        canvas.height = vid.videoHeight || 260;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      } catch { resolve(null); }
      cleanup();
    });
    vid.addEventListener("error", () => { resolve(null); cleanup(); });
    document.body.appendChild(vid);
  });
}

function render() {
  if (state.screen === "dashboard") app.innerHTML = renderDashboard();
  else if (state.screen === "edit") app.innerHTML = renderEdit();
  else if (state.screen === "preview") app.innerHTML = renderPreview();
  bindEvents();
}

/* ===================== waveform ===================== */

function waveformBars(seedNum, bars=40) {
  let s = seedNum * 9301 + 49297; const out = [];
  for (let i=0;i<bars;i++){ s=(s*9301+49297)%233280; out.push(0.25+(s/233280)*0.75); }
  return out;
}
function renderWaveform(seedNum, waveId) {
  const bars = waveformBars(typeof seedNum === "number" ? seedNum : 1);
  const barsMarkup = bars.map(h => `<div style="width:3px;border-radius:2px;height:${(h*100).toFixed(1)}%;background:currentColor;flex-shrink:0"></div>`).join("");
  return `
  <div style="position:relative;height:32px;flex:1" data-wave-id="${waveId}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;gap:2px;color:var(--beige-dark)">${barsMarkup}</div>
    <div class="wave-fill" style="position:absolute;inset:0;display:flex;align-items:center;gap:2px;color:var(--bordeaux);width:0%;overflow:hidden;white-space:nowrap">${barsMarkup}</div>
  </div>`;
}

          <input class="field-input" id="f-cover" placeholder="https://..." value="${esc(c.cover)}">
          <button class="btn-ghost" data-action="pick-file" data-kind="cover" data-accept="image/*">${ic.folder} Parcourir</button>
        </div>
      </div>
      <div style="grid-column:1/-1">
        <label class="field-label">Photo de la section finale — URL ou fichier</label>
        <div style="display:flex;gap:8px">
          <input class="field-input" id="f-final" placeholder="https://..." value="${esc(c.final)}">
          <button class="btn-ghost" data-action="pick-file" data-kind="final" data-accept="image/*">${ic.folder} Parcourir</button>
        </div>
      </div>
    </div>

      <h3 style="font-family:'Playfair Display',serif;font-size:19px;color:var(--bordeaux);margin-bottom:8px">Catégories de moments</h3>
      <p style="font-size:12px;color:var(--texte-soft);margin-bottom:14px">Chaque mariage a ses propres traditions — adaptez librement cette liste (ex: "Henné", "Cravate", "Coupe du gâteau"...).</p>

        ${c.categories.length === 0 ? `<p style="font-size:13px;color:var(--beige-dark)">Aucune catégorie — ajoutez-en une ci-dessous.</p>` : ""}

      <div style="display:flex;gap:8px;max-width:360px">
        <input class="field-input" id="new-category-input" placeholder="Nouvelle catégorie (ex: Henné)">

    </div>

    <div style="margin-bottom:40px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <h3 style="font-family:'Playfair Display',serif;font-size:19px;color:var(--bordeaux)">Photos</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-outline" data-action="pick-file" data-kind="photo-bulk" data-accept="image/*" data-multiple="1">${ic.folder} Importer des photos</button>
          <button class="btn btn-outline" data-action="add-photo">${ic.plus} Ajouter un lien</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${photoRows || `<p style="font-size:13px;color:var(--beige-dark)">Rien pour l'instant.</p>`}
      </div>
    </div>

    ${repeatSection("Vidéos", "video", videoRows)}
    ${repeatSection("Livre d'or audio", "message", msgRows)}
    ${repeatSection("Produits (album photo, pins, etc.)", "product", productRows)}

    <div style="display:flex;gap:14px;margin-top:20px">
      <button class="btn btn-primary" data-action="save-coffret" id="save-btn">${ic.check} Enregistrer le coffret</button>
      <button class="btn btn-ghost" data-action="cancel-edit">Annuler</button>
    </div>
  </div>`;
}

function syncEditFieldsIntoState() {
  const c = state.activeCoffret;
  const g = (id) => document.getElementById(id)?.value ?? "";
  c.names = g("f-names"); c.code = g("f-code"); c.date = g("f-date");
  c.location = g("f-location"); c.cover = g("f-cover"); c.final = g("f-final");
}

/* ===================== CLIENT PREVIEW ===================== */

function renderPreview() {
  const c = state.activeCoffret;
  const p = state.preview;
  const backBtn = `<button data-action="exit-preview" style="position:fixed;top:14px;left:14px;z-index:200;background:var(--texte);color:var(--blanc);border:none;border-radius:30px;padding:9px 16px;font-size:12px;display:flex;align-items:center;gap:8px">${ic.arrowLeft} Administration</button>`;

  if (!p.unlocked) {
    return backBtn + `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bordeaux-deep),var(--bordeaux));padding:24px;text-align:center">
      <div style="max-width:420px;width:100%">
        <img src="${LOGO_SRC}" alt="Yalm Events" style="width:84px;height:84px;border-radius:50%;margin:0 auto 26px;display:block">
        <p style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--beige);opacity:.7;margin-bottom:18px">Coffret numérique de mariage</p>
        <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,5vw,40px);color:var(--blanc);margin-bottom:14px;line-height:1.25">Bienvenue dans votre<br>espace souvenir</h1>
        <p style="font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--beige);opacity:.85;margin-bottom:40px">${esc(c.names) || "Vos noms"}</p>
        <form id="gate-form" style="display:flex;flex-direction:column;gap:14px;align-items:center">
          <label style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--beige);opacity:.75">Entrez votre code d'accès</label>
          <input id="gate-code" placeholder="Votre code" style="width:100%;max-width:280px;text-align:center;background:transparent;border:1px solid ${p.codeError?'#D98787':'rgba(255,255,255,.35)'};border-radius:2px;padding:13px 16px;color:var(--blanc);font-size:15px;letter-spacing:3px">
          ${p.codeError ? `<p style="color:#E8A6A6;font-size:12px">Code incorrect. Merci de vérifier votre invitation.</p>` : ""}
          <button type="submit" style="margin-top:10px;background:var(--blanc);color:var(--bordeaux);border:none;padding:13px 34px;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px">Entrer</button>
        </form>
      </div>
    </div>`;
  }

  const navItems = [["home","Accueil"],["photos","Photos"],["videos","Vidéos"],["audio","Livre d'or audio"]];
  if (c.products && c.products.length > 0) navItems.push(["produits","Produits"]);
  navItems.push(["downloads","Téléchargements"]);
  const nav = `
  <div style="position:sticky;top:0;z-index:40;background:rgba(251,248,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--beige-dark)">
    <div style="max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 24px">
      <button data-action="nav" data-view="home" style="background:none;border:none;display:flex;align-items:center;gap:12px">
        <img src="${LOGO_SRC}" alt="" style="height:34px;width:34px;object-fit:cover;border-radius:50%">
        <span style="font-family:'Playfair Display',serif;font-size:19px;color:var(--bordeaux)">${esc(c.names)}</span>
      </button>
      <div class="nav-links">
        ${navItems.map(([id,label])=>`<button data-action="nav" data-view="${id}" style="background:none;border:none;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:4px 0;color:${p.view===id?'var(--bordeaux)':'var(--texte-soft)'};border-bottom:1px solid ${p.view===id?'var(--bordeaux)':'transparent'}">${label}</button>`).join("")}
      </div>
      <button class="nav-burger" data-action="toggle-menu">${ic.list}</button>
    </div>
    <div class="nav-mobile-panel ${p.menuOpen?'open':''}">
      ${navItems.map(([id,label])=>`<button data-action="nav" data-view="${id}" style="background:none;border:none;text-align:left;padding:10px 0;font-size:14px;color:${p.view===id?'var(--bordeaux)':'var(--texte-soft)'};border-bottom:1px solid var(--beige)">${label}</button>`).join("")}
    </div>
  </div>`;

  let body = "";
  if (p.view === "home") body = renderHome(c);
  else if (p.view === "photos") body = renderPhotos(c);
  else if (p.view === "videos") body = renderVideos(c);
  else if (p.view === "audio") body = renderAudio(c);
  else if (p.view === "produits") body = renderProducts(c);
  else if (p.view === "downloads") body = renderDownloads(c);

  let overlays = "";
  if (p.lightboxIndex !== null) overlays += renderLightbox(c);
  if (p.videoModal !== null) overlays += renderVideoModal(c);
  if (p.qrModal) overlays += renderQrModal(c);

  return backBtn + `<div>${nav}${body}${overlays}</div>`;
}

function renderHome(c) {
  const cards = [
    { id:"photos", label:"Photos", count:`${c.photos.length} souvenirs`, img: c.photos[0]?.src || "https://picsum.photos/seed/dash-photos/700/900", ic: ic.cam },
    { id:"videos", label:"Vidéos", count:`${c.videos.length} films`, img: c.videos[0]?.thumb || FALLBACK_VIDEO_THUMB, ic: ic.vid },
    { id:"audio", label:"Livre d'or audio", count:`${c.messages.length} messages`, img:"https://picsum.photos/seed/dash-audio/700/900", ic: ic.mic },
  ];
  if (c.products && c.products.length > 0) {
    cards.push({ id:"produits", label:"Produits", count:`${c.products.length} article${c.products.length>1?"s":""}`, img: c.products[0]?.image || "https://picsum.photos/seed/dash-produits/700/900", ic: ic.gift });

  return `

      <img src="${esc(c.cover)}" alt="" style="width:100%;height:100%;object-fit:cover">

        <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(38px,7vw,68px);color:var(--blanc);margin-bottom:18px">${esc(c.names)}</h1>
        <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;color:var(--beige);margin-bottom:44px">${esc(c.date)} — ${esc(c.location)}</p>
        <button data-action="nav" data-view="photos" style="background:transparent;border:1px solid var(--blanc);color:var(--blanc);padding:15px 36px;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px">Découvrir vos souvenirs ${ic.arrowRight}</button>
      </div>
    </div>
    <section style="max-width:1180px;margin:0 auto;padding:110px 24px">
      <div style="text-align:center;margin-bottom:64px">
        <p style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--bordeaux);opacity:.7;margin-bottom:14px">Le coffret</p>
        <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,4vw,42px)">Vos souvenirs</h2>
      </div>
      <div class="dash-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px">
        ${cards.map(cd => `
        <button class="dash-card" data-action="nav" data-view="${cd.id}">
          <img src="${esc(cd.img)}" alt="">
          <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(61,15,31,0) 40%,rgba(61,15,31,.85) 100%)"></div>
          <div style="position:absolute;left:28px;bottom:28px;right:28px;color:var(--blanc)">
            <div style="margin-bottom:12px;opacity:.9">${cd.ic}</div>
            <h3 style="font-family:'Playfair Display',serif;font-weight:400;font-size:26px;margin-bottom:6px">${cd.label}</h3>
            <p style="font-size:13px;opacity:.85;margin-bottom:18px">${cd.count}</p>
            <span style="font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:4px">Découvrir</span>
          </div>
        </button>`).join("")}
      </div>
    </section>
    <div style="display:flex;justify-content:center;gap:28px;padding:0 24px 20px;flex-wrap:wrap">
      <button data-action="copy-link" style="background:none;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texte-soft)">${ic.copy} Copier le lien</button>
      <button data-action="show-qr" style="background:none;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texte-soft)">${ic.qr} QR Code</button>
      <button data-action="share-space" style="background:none;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--texte-soft)">${ic.share} Partager notre espace</button>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--beige-dark);padding:0 24px 90px">${esc(getShareLink(c))}</p>

      <img src="${esc(c.final)}" alt="" style="width:100%;height:100%;object-fit:cover">

        <p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,3vw,28px);color:var(--blanc);line-height:1.6;margin-bottom:24px">Une journée passe vite.<br>Les souvenirs, eux, restent.</p>

function emptySection(iconSvg, text) {
  return `<div style="padding:120px 24px;text-align:center"><div style="color:var(--beige-dark);margin-bottom:16px">${iconSvg}</div><p style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;color:var(--texte-soft)">${text}</p></div>`;
}

function renderPhotos(c) {
  const p = state.preview;
  if (c.photos.length === 0) return emptySection(ic.cam, "Aucune photo n'a encore été ajoutée à ce coffret.");
  const cats = ["Tout", ...(c.categories && c.categories.length ? c.categories : DEFAULT_CATEGORIES)];
  const filtered = p.filter === "Tout" ? c.photos : c.photos.filter(x => x.category === p.filter);
  const favs = c.photos.filter(x => p.favorites.has(x.id));

  return `
  <div style="max-width:1180px;margin:0 auto;padding:70px 24px 110px">
    <header style="text-align:center;margin-bottom:48px">
      <p style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--bordeaux);opacity:.7;margin-bottom:14px">Galerie</p>
      <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,4vw,42px);margin-bottom:22px">Photos</h2>
      <button class="btn btn-primary" data-action="zip-photos">${ic.download} Télécharger toutes les photos</button>
    </header>
    ${favs.length > 0 ? `
    <div style="margin-bottom:56px">
      <h3 style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--bordeaux);margin-bottom:18px;display:flex;align-items:center;gap:8px">${ic.heart(true)} Les coups de cœur</h3>
      <div style="display:flex;gap:20px;overflow-x:auto;padding:10px 8px 18px">
        ${favs.map((x,i) => `<img class="polaroid" src="${esc(x.src)}" alt="" style="height:160px;border-radius:1px;flex-shrink:0;cursor:pointer;transform:rotate(${i%2?3:-3}deg)" data-action="open-lightbox" data-id="${x.id}">`).join("")}
      </div>
    </div>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:40px">
      ${cats.map(cat => `<button class="chip ${p.filter===cat?'active':''}" data-action="set-filter" data-cat="${esc(cat)}">${cat}</button>`).join("")}
    </div>
    <div class="masonry">
      ${filtered.map((x,i) => `
      <div class="masonry-item" data-action="open-lightbox" data-id="${x.id}" style="animation-delay:${Math.min(i*0.04,0.6)}s">
        <img src="${esc(x.src)}" alt="" loading="lazy" style="width:100%;display:block;border-radius:2px">
        <button class="fav-btn" data-action="toggle-fav" data-id="${x.id}" style="position:absolute;top:10px;right:10px;background:rgba(61,15,31,.45);border:none;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:${p.favorites.has(x.id)?'#E39A9A':'var(--blanc)'}">${ic.heart(p.favorites.has(x.id))}</button>
      </div>`).join("")}
    </div>
  </div>`;
}

function renderLightbox(c) {
  const p = state.preview;
  const photo = c.photos[p.lightboxIndex];
  if (!photo) return "";
  return `
  <div style="position:fixed;inset:0;background:rgba(20,8,12,.96);z-index:100;display:flex;align-items:center;justify-content:center">
    <button data-action="close-lightbox" style="position:absolute;top:24px;right:28px;background:none;border:none;color:var(--blanc)">${ic.x}</button>
    <button data-action="lightbox-prev" style="position:absolute;left:20px;background:none;border:none;color:var(--blanc)">${ic.chevL}</button>
    <img src="${esc(photo.src)}" alt="" style="max-height:82vh;max-width:82vw;object-fit:contain">
    <button data-action="lightbox-next" style="position:absolute;right:20px;background:none;border:none;color:var(--blanc)">${ic.chevR}</button>
    <div style="position:absolute;bottom:28px;display:flex;gap:26px;align-items:center">
      <button data-action="toggle-fav" data-id="${photo.id}" style="background:none;border:none;color:${p.favorites.has(photo.id)?'#D98787':'var(--blanc)'}">${ic.heart(p.favorites.has(photo.id))}</button>
      <a href="${esc(photo.src)}" download target="_blank" rel="noreferrer" style="background:none;border:1px solid rgba(255,255,255,.4);color:var(--blanc);padding:9px 20px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;text-decoration:none">${ic.download} Télécharger</a>
    </div>
  </div>`;
}

function renderVideos(c) {
  if (c.videos.length === 0) return `<div style="background:var(--bordeaux-deep)">${emptySection(ic.vid, "Aucune vidéo n'a encore été ajoutée à ce coffret.")}</div>`;
  return `
  <div style="background:var(--bordeaux-deep);padding:70px 24px 110px">
    <div style="max-width:1180px;margin:0 auto">
      <header style="text-align:center;margin-bottom:56px">
        <p style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--beige);opacity:.75;margin-bottom:14px">Médiathèque</p>
        <h2 style="font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,4vw,42px);color:var(--blanc);margin-bottom:22px">Vidéos</h2>
        <button style="background:var(--blanc);color:var(--bordeaux);border:none;padding:13px 30px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px" data-action="zip-videos">${ic.download} Télécharger les vidéos</button>
      </header>
      <div class="video-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:26px">
        ${c.videos.map((v,i) => `
        <button class="video-card fade-in-up" data-action="open-video" data-id="${v.id}" style="animation-delay:${Math.min(i*0.08,0.5)}s">
          <div class="thumb-wrap">
            <img src="${esc(v.thumb || FALLBACK_VIDEO_THUMB)}" alt="">
            <div style="position:absolute;inset:0;background:rgba(61,15,31,.25)"></div>
            <div class="play-circle" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:1px solid var(--blanc);display:flex;align-items:center;justify-content:center;color:var(--blanc)">${ic.play}</div>
            <span style="position:absolute;bottom:10px;right:12px;color:var(--blanc);font-size:11px;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:20px">${esc(v.duration)}</span>
          </div>
          <p style="font-family:'Playfair Display',serif;font-size:18px;color:var(--blanc);margin-top:14px">${esc(v.title)}</p>
        </button>`).join("")}
      </div>
    </div>
  </div>`;
}

function renderVideoModal(c) {
  const p = state.preview;
  const v = c.videos.find(x => x.id === p.videoModal);
  if (!v) return "";
  return `
  <div style="position:fixed;inset:0;background:rgba(8,3,5,.97);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
    <button data-action="close-video" style="position:absolute;top:24px;right:28px;background:none;border:none;color:var(--blanc)">${ic.x}</button>

      ${v.src
        ? `<video src="${esc(v.src)}" controls autoplay style="width:100%;height:auto;max-height:78vh;display:block;object-fit:contain;background:#000;border-radius:2px"></video>`
        : `<img src="${esc(v.thumb || FALLBACK_VIDEO_THUMB)}" alt="" style="width:100%;border-radius:2px;filter:brightness(.65)">
           <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(251,248,243,.92);display:flex;align-items:center;justify-content:center;color:var(--bordeaux)">${ic.play}</div>`
      }
    </div>
    <div style="width:100%;max-width:920px;margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <p style="font-family:'Playfair Display',serif;font-size:18px;color:var(--blanc)">${esc(v.title)}</p>
        <p style="font-size:12px;color:var(--beige);opacity:.7">${esc(v.duration)}</p>
      </div>
      <div style="display:flex;gap:18px;color:var(--blanc)">${ic.share}${ic.download}</div>
    </div>
  </div>`;
}

function renderQrModal(c) {
  const link = getShareLink(c);
  const qrImg = "https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=" + encodeURIComponent(link);

/* ===================== event binding ===================== */

function bindEvents() {
  app.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", onAction);
  });

  const gateForm = document.getElementById("gate-form");
  if (gateForm) gateForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = document.getElementById("gate-code").value.trim();
    if (val === (state.activeCoffret.code || "")) { state.preview.unlocked = true; state.preview.codeError = false; }
    else state.preview.codeError = true;
    render();
  });

  // edit-form field inputs -> sync into draft object (no full re-render needed)
  app.querySelectorAll("[data-field]").forEach(el => {
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, () => {
      const kind = el.dataset.kind, id = el.dataset.id, field = el.dataset.field;
      const c = state.activeCoffret;
      const list = listForKind(c, kind);
      const row = list.find(r => r.id === id);
      if (!row) return;
      row[field] = field === "duration" && kind === "message" ? Number(el.value) : el.value;
    });
  });
}

async function onAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;

  if (action === "pick-file") {
    pendingTarget = { kind: el.dataset.kind, id: el.dataset.id, field: el.dataset.field };
    hiddenInput.accept = el.dataset.accept || "";
    hiddenInput.multiple = el.dataset.multiple === "1";
    hiddenInput.click();
    return;
  }

  if (action === "zip-photos") {
    const c = state.activeCoffret;
    await downloadZip(c.photos.map(p => ({ name: `${p.category}-${p.id}`, url: p.src })), `${slugify(c.names)}-photos`, el);
    return;
  }
  if (action === "zip-videos") {
    const c = state.activeCoffret;
    const withFiles = c.videos.filter(v => v.src);
    if (!withFiles.length) { alert("Aucune vidéo n'a de fichier réel associé pour l'instant (seulement des miniatures)."); return; }
    await downloadZip(withFiles.map(v => ({ name: v.title || v.id, url: v.src })), `${slugify(c.names)}-videos`, el);
    return;
  }
  if (action === "zip-audio") {
    const c = state.activeCoffret;
    const withFiles = c.messages.filter(m => m.src);
    if (!withFiles.length) { alert("Aucun message audio n'a de fichier réel associé pour l'instant."); return; }
    await downloadZip(withFiles.map(m => ({ name: m.name || m.id, url: m.src })), `${slugify(c.names)}-livre-dor-audio`, el);
    return;
  }
  if (action === "zip-all") {
    const c = state.activeCoffret;
    const entries = [
      ...c.photos.map(p => ({ name: `photos/${p.category}-${p.id}`, url: p.src })),
      ...c.videos.filter(v => v.src).map(v => ({ name: `videos/${v.title || v.id}`, url: v.src })),
      ...c.messages.filter(m => m.src).map(m => ({ name: `audio/${m.name || m.id}`, url: m.src })),
    ];
    await downloadZip(entries, `${slugify(c.names)}-coffret-complet`, el);
    return;
  }

  if (action === "new") { state.activeCoffret = blankCoffret(); state.screen = "edit"; render(); return; }

  if (action === "edit") {
    const c = await loadCoffret(el.dataset.slug);
    state.activeCoffret = c || blankCoffret();
    state.screen = "edit"; render(); return;
  }

  if (action === "preview") {
    audioPlayer.pause();
    const c = await loadCoffret(el.dataset.slug);
    state.activeCoffret = c;
    state.preview = { unlocked:false, view:"home", code:"", codeError:false, menuOpen:false, filter:"Tout", favorites:new Set(), lightboxIndex:null, videoModal:null, qrModal:false, audio:{answered:false, ringing:true, playingId:null, continuous:false} };
    state.screen = "preview"; render(); return;
  }

  if (action === "duplicate") {
    const slug = el.dataset.slug;
    const c = await loadCoffret(slug);
    if (!c) return;
    let newSlug = slugify(c.names) + "-copie", i = 2;
    const existing = (await loadIndex()).map(x => x.slug);
    while (existing.includes(newSlug)) { newSlug = `${slugify(c.names)}-copie-${i}`; i++; }
    const copy = { ...c, slug: newSlug, names: c.names + " (copie)", updatedAt: Date.now() };
    await saveCoffret(copy); await updateIndexEntry(copy); await refreshIndex(); return;
  }

  if (action === "delete") {
    const slug = el.dataset.slug;
    await deleteCoffretStorage(slug);
    const list = await loadIndex();
    await saveIndex(list.filter(x => x.slug !== slug));
    await refreshIndex(); return;
  }

  if (action === "cancel-edit") { state.screen = "dashboard"; render(); return; }

  if (action === "save-coffret") {
    syncEditFieldsIntoState();
    const c = state.activeCoffret;
    const slug = c.slug || slugify(c.names);
    c.slug = slug; c.updatedAt = Date.now();
    try {
      await saveCoffret(c);
      await updateIndexEntry(c);
      await refreshIndex();
      state.screen = "dashboard";
    } catch (err) {
      if (err && err.code === "TOO_LARGE") {
        alert("Ce coffret est trop volumineux pour être enregistré (au-delà d'environ 4,5 Mo au total). Retirez quelques photos/audios importés directement, ou remplacez-les par un lien hébergé (Drive, Cloudflare R2...) plutôt qu'un fichier intégré.");
      } else {
        state.storageError = true;
        console.error("Save failed", err);
      }
    }
    render(); return;
  }

  if (action === "add-photo") { syncEditFieldsIntoState(); state.activeCoffret.photos.push({ id: uid(), category: state.activeCoffret.categories[0] || "Photos", src: "" }); render(); return; }
  if (action === "add-bulk-links") {
    syncEditFieldsIntoState();
    const c = state.activeCoffret;
    const type = document.getElementById("bulk-link-type")?.value || "photo";
    const raw = document.getElementById("bulk-link-textarea")?.value || "";
    const links = raw.split("\n").map(l => l.trim()).filter(Boolean);
    if (links.length === 0) return;
    links.forEach((url, i) => {
      if (type === "photo") c.photos.push({ id: uid(), category: c.categories[0] || "Photos", src: url });
      else if (type === "video") c.videos.push({ id: uid(), title: `Vidéo ${c.videos.length + 1}`, duration: "", thumb: "", src: url });
      else c.messages.push({ id: uid(), name: `Message ${c.messages.length + 1}`, duration: 30, quote: "", src: url });
    });
    render();
    return;
  }
  if (action === "add-category") {
    syncEditFieldsIntoState();
    const input = document.getElementById("new-category-input");
    const val = (input?.value || "").trim();
    if (val && !state.activeCoffret.categories.includes(val)) state.activeCoffret.categories.push(val);
    render(); return;
  }
  if (action === "remove-category") {
    syncEditFieldsIntoState();
    state.activeCoffret.categories = state.activeCoffret.categories.filter(cat => cat !== el.dataset.cat);
    render(); return;
  }
  if (action === "remove-photo") { syncEditFieldsIntoState(); state.activeCoffret.photos = state.activeCoffret.photos.filter(p => p.id !== el.dataset.id); render(); return; }
  if (action === "add-video") { syncEditFieldsIntoState(); state.activeCoffret.videos.push({ id: uid(), title:"", duration:"", thumb:"", src:"" }); render(); return; }
  if (action === "remove-video") { syncEditFieldsIntoState(); state.activeCoffret.videos = state.activeCoffret.videos.filter(v => v.id !== el.dataset.id); render(); return; }
  if (action === "add-message") { syncEditFieldsIntoState(); state.activeCoffret.messages.push({ id: uid(), name:"", duration:30, quote:"", src:"" }); render(); return; }
  if (action === "remove-message") { syncEditFieldsIntoState(); state.activeCoffret.messages = state.activeCoffret.messages.filter(m => m.id !== el.dataset.id); render(); return; }
  if (action === "add-product") { syncEditFieldsIntoState(); state.activeCoffret.products.push({ id: uid(), name:"", price:"", description:"", image:"", link:"" }); render(); return; }
  if (action === "remove-product") { syncEditFieldsIntoState(); state.activeCoffret.products = state.activeCoffret.products.filter(pr => pr.id !== el.dataset.id); render(); return; }

  if (action === "exit-preview") {
    clearAudioTimer();
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    state.screen = "dashboard"; render(); return;
  }

  if (action === "nav") { state.preview.view = el.dataset.view; state.preview.menuOpen = false; window.scrollTo({top:0}); render(); return; }
  if (action === "toggle-menu") { state.preview.menuOpen = !state.preview.menuOpen; render(); return; }

  if (action === "set-filter") { state.preview.filter = el.dataset.cat; render(); return; }
  if (action === "toggle-fav") {
    const id = el.dataset.id;
    state.preview.favorites.has(id) ? state.preview.favorites.delete(id) : state.preview.favorites.add(id);
    render(); return;
  }
  if (action === "open-lightbox") {
    const id = el.dataset.id;
    state.preview.lightboxIndex = state.activeCoffret.photos.findIndex(p => p.id === id);
    render(); return;
  }
  if (action === "close-lightbox") { state.preview.lightboxIndex = null; render(); return; }
  if (action === "lightbox-prev") { const n = state.activeCoffret.photos.length; state.preview.lightboxIndex = (state.preview.lightboxIndex - 1 + n) % n; render(); return; }
  if (action === "lightbox-next") { const n = state.activeCoffret.photos.length; state.preview.lightboxIndex = (state.preview.lightboxIndex + 1) % n; render(); return; }

  if (action === "open-video") { state.preview.videoModal = el.dataset.id; render(); return; }
  if (action === "close-video") { state.preview.videoModal = null; render(); return; }

  if (action === "copy-link") {
    const link = getShareLink(state.activeCoffret);
    const original = el.innerHTML;
    try {
      await navigator.clipboard.writeText(link);
      el.innerHTML = `${ic.check} Lien copié`;
      setTimeout(() => { el.innerHTML = original; }, 1800);
    } catch {
      window.prompt("Copiez ce lien :", link);
    }
    return;
  }
  if (action === "show-qr") { state.preview.qrModal = true; render(); return; }
  if (action === "close-qr") { state.preview.qrModal = false; render(); return; }
  if (action === "share-space") {
    const c = state.activeCoffret;
    const link = getShareLink(c);
    if (navigator.share) {
      try { await navigator.share({ title: c.names, text: "Votre coffret souvenir", url: link }); } catch {}
    } else {
      try { await navigator.clipboard.writeText(link); alert("Lien copié :\n" + link); }
      catch { window.prompt("Copiez ce lien :", link); }
    }
    return;
  }

  if (action === "pick-up") {
    state.preview.audio.ringing = false; render();
    setTimeout(() => { state.preview.audio.answered = true; render(); }, 550);
    return;
  }
  if (action === "play-message") {
    const id = el.dataset.id, cont = el.dataset.continuous === "1";
    if (state.preview.audio.playingId === id) { audioPlayer.pause(); state.preview.audio.playingId = null; render(); }
    else playMessage(id, cont);
    return;
  }
}

async function updateIndexEntry(c) {
  const list = await loadIndex();
  const meta = { slug: c.slug, names: c.names, date: c.date, location: c.location, code: c.code, updatedAt: c.updatedAt };
  await saveIndex([...list.filter(e => e.slug !== c.slug), meta]);
}

async function refreshIndex() {
  state.loading = true; render();
  try {
    const list = await loadIndex();
    state.index = list.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    state.storageError = false;
  } catch { state.storageError = true; }
  state.loading = false; render();
}

const audioPlayer = document.getElementById("audio-player");

function clearAudioTimer() {
  if (state.preview.audio.playingId !== null) {
    audioPlayer.pause();
  }
  state.preview.audio.playingId = null;
}

function resetWaveUI(id) {
  const wave = document.querySelector(`[data-wave-id="${id}"] .wave-fill`);
  if (wave) wave.style.width = "0%";
  const btn = document.getElementById(`play-btn-${id}`);
  if (btn) btn.innerHTML = ic.play;
  const msg = state.activeCoffret?.messages.find(m => m.id === id);
  const timeLabel = document.getElementById(`time-${id}`);
  if (timeLabel && msg) timeLabel.textContent = fmtTime(msg.duration || 30);
}

audioPlayer.addEventListener("timeupdate", () => {
  const id = state.preview.audio.playingId;
  if (id === null || !audioPlayer.duration || isNaN(audioPlayer.duration)) return;
  const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
  const wave = document.querySelector(`[data-wave-id="${id}"] .wave-fill`);
  if (wave) wave.style.width = percent + "%";
  const timeLabel = document.getElementById(`time-${id}`);
  if (timeLabel) timeLabel.textContent = fmtTime(Math.max(0, audioPlayer.duration - audioPlayer.currentTime));
});

audioPlayer.addEventListener("ended", () => {
  const id = state.preview.audio.playingId;
  const cont = state.preview.audio.continuous;
  if (id !== null) resetWaveUI(id);
  state.preview.audio.playingId = null;
  if (cont && id !== null) {
    const msgs = state.activeCoffret.messages;
    const idx = msgs.findIndex(m => m.id === id);
    const next = msgs[idx + 1];
    if (next && next.src) { playMessage(next.id, true); return; }
  }
  render();
});

audioPlayer.addEventListener("error", () => {
  const id = state.preview.audio.playingId;
  if (id !== null) resetWaveUI(id);
  state.preview.audio.playingId = null;
  render();
});

function playMessage(id, cont) {
  const msg = state.activeCoffret.messages.find(m => m.id === id);
  if (!msg || !msg.src) {
    alert("Ce message n'a pas encore de fichier audio associé — ajoutez-en un depuis la fiche du coffret.");
    return;
  }
  const previousId = state.preview.audio.playingId;
  if (previousId !== null && previousId !== id) resetWaveUI(previousId);

  state.preview.audio.playingId = id;
  state.preview.audio.continuous = cont;
  try {
    if (audioPlayer.src !== msg.src) {
      audioPlayer.pause();
      audioPlayer.src = msg.src;
      audioPlayer.load();
    }
    const playPromise = audioPlayer.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(err => {
        console.error("Audio playback failed", err);
        alert(`La lecture audio n'a pas pu démarrer (${err && err.name ? err.name : "erreur inconnue"}). Si ce fichier a été ajouté depuis votre ordinateur lors d'une session précédente et dépasse 4 Mo, il n'est plus disponible après rechargement — réimportez-le, ou utilisez un lien hébergé (Drive, Cloudflare R2...) à la place.`);
        state.preview.audio.playingId = null;
        resetWaveUI(id);
        render();
      });
    }
  } catch (err) {
    console.error("Audio playback error", err);
    alert(`La lecture audio n'a pas pu démarrer (${err && err.name ? err.name : "erreur inconnue"}).`);
    state.preview.audio.playingId = null;
    resetWaveUI(id);
  }
  render();
}

function togglePauseMessage(id) {
  if (state.preview.audio.playingId === id) {
    audioPlayer.pause();
    state.preview.audio.playingId = null;
    render();
  } else {
    playMessage(id, false);
  }
}

async function downloadZip(entries, zipName, btnEl) {
  if (!entries.length) { alert("Il n'y a rien à télécharger ici pour le moment."); return; }
  if (typeof JSZip === "undefined") { alert("Le module de compression n'a pas pu se charger. Vérifiez votre connexion et réessayez."); return; }
  const original = btnEl.innerHTML;
  btnEl.setAttribute("disabled", "disabled");
  btnEl.innerHTML = `${ic.loader} Préparation du zip...`;

  const zip = new JSZip();
  let failed = 0;
  const usedNames = new Set();

  for (const entry of entries) {
    try {
      const res = await fetch(entry.url);
      if (!res.ok) throw new Error("fetch failed");
      const blob = await res.blob();
      let ext = "";
      const typeExt = (blob.type.split("/")[1] || "").replace("jpeg", "jpg").split(";")[0];
      if (typeExt) ext = "." + typeExt;
      else { const m = entry.url.match(/\.([a-zA-Z0-9]{2,4})(?:\?|#|$)/); if (m) ext = "." + m[1]; }
      let base = (entry.name || "fichier").replace(/[\\/:*?"<>|]+/g, "-").trim() || "fichier";
      let filename = base + ext, i = 2;
      while (usedNames.has(filename)) { filename = `${base}-${i}${ext}`; i++; }
      usedNames.add(filename);
      zip.file(filename, blob);
    } catch { failed++; }
  }

  try {
    const content = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(content);
    const a = document.createElement("a");
    a.href = url; a.download = zipName.endsWith(".zip") ? zipName : zipName + ".zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch {
    alert("La création du fichier zip a échoué.");
  }

  btnEl.removeAttribute("disabled");
  btnEl.innerHTML = original;
  if (failed > 0) {
    alert(`${failed} fichier(s) n'ont pas pu être ajoutés au zip (souvent des liens externes qui bloquent le téléchargement direct). Le reste a bien été inclus.`);
  }
}

async function boot() {
  const m = location.hash.match(/^#\/mariage\/(.+)$/);
  if (m) {
    const slug = decodeURIComponent(m[1]);
    const c = await loadCoffret(slug);
    if (c) {
      state.activeCoffret = c;
      state.preview = { unlocked:false, view:"home", code:"", codeError:false, menuOpen:false, filter:"Tout", favorites:new Set(), lightboxIndex:null, videoModal:null, qrModal:false, audio:{answered:false, ringing:true, playingId:null, continuous:false} };
      state.screen = "preview";
      state.loading = false;
      render();
      return;
    }
  }
  if (!window.__COFFRET_ADMIN__) {
    app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:'Inter',sans-serif;color:var(--texte-soft);">Lien invalide ou expiré.</div>`;
    return;
  }
  refreshIndex();
}
boot();
